<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jet Tesfa Control</title><style>
body{font-family:system-ui;margin:0;background:#071522;color:#eef6ff}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,button{padding:12px;border-radius:10px;border:1px solid #345;background:#10283d;color:white}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:22px 0}.card{background:#0d2235;padding:18px;border-radius:16px;border:1px solid #173b58}.n{font-size:30px;font-weight:800}.muted{opacity:.7}table{width:100%;border-collapse:collapse;background:#0d2235;border-radius:16px;overflow:hidden}td,th{padding:11px;border-bottom:1px solid #173b58;text-align:right}.ok{color:#7ee2a8}.bad{color:#ff9a9a}h1{margin-bottom:4px}</style></head><body><main><h1>Jet Tesfa Control</h1><div class="muted">מרכז בקרה פרטי — שימוש, משפך, שביעות רצון, AI ומקורות</div><div class="top"><input id="token" type="password" placeholder="JET_ADMIN_TOKEN"><button onclick="load()">כניסה / רענון</button><span id="status"></span></div><div id="cards" class="grid"></div><h2>בריאות מקורות</h2><div id="sources"></div><h2>Model Arena</h2><div id="models"></div><h2>ביקוש ותובנות</h2><pre id="discovery" class="card" style="white-space:pre-wrap"></pre></main><script>
const e=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){let t=e('#token').value.trim();sessionStorage.setItem('jet_admin',t);e('#status').textContent='טוען…';let r=await fetch('/api/analytics',{headers:{Authorization:'Bearer '+t}});if(!r.ok){e('#status').textContent='גישה נדחתה';return}let d=await r.json();e('#status').textContent='מחובר · '+d.experience_version;let f=d.funnel||{},s=d.satisfaction||{};let cards=[['חיפושים',f.searches],['קליקים החוצה',f.clicks],['רכישות',f.purchases],['חיפוש→קליק',f.search_to_click_pct+'%'],['קליק→רכישה',f.click_to_purchase_pct+'%'],['דירוג ממוצע',s.average_rating+'/5'],['פרופילי DNA',d.anonymous_profiles],['מוצרים בזיכרון',d.products]];e('#cards').innerHTML=cards.map(x=>`<div class=card><div class=muted>${esc(x[0])}</div><div class=n>${esc(x[1])}</div></div>`).join('');e('#sources').innerHTML='<table><tr><th>מקור</th><th>מצב</th><th>זמן תגובה</th><th>תוצאות</th><th>עדכון</th></tr>'+d.source_health.map(x=>`<tr><td>${esc(x.source)}</td><td class=${x.ok?'ok':'bad'}>${x.ok?'תקין':'תקלה'}</td><td>${esc(x.latency_ms)} ms</td><td>${esc(x.result_count)}</td><td>${new Date(x.updated*1000).toLocaleString('he-IL')}</td></tr>`).join('')+'</table>';let ms=d.model_arena?.stats||{};e('#models').innerHTML='<table><tr><th>מודל</th><th>חשיפות</th><th>קליקים</th><th>רכישות</th><th>החזרים</th><th>שביעות רצון</th></tr>'+Object.entries(ms).map(([k,v])=>`<tr><td>${esc(k)}${k===d.model_arena.active?' ★':''}</td><td>${v.impressions}</td><td>${v.clicks}</td><td>${v.purchases}</td><td>${v.refunds}</td><td>${esc(v.satisfaction)}</td></tr>`).join('')+'</table>';e('#discovery').textContent=JSON.stringify(d.discovery,null,2)}
e('#token').value=sessionStorage.getItem('jet_admin')||'';</script></body></html>
